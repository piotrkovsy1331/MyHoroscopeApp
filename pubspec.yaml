name: mystic_horoscope
description: "Mystic Horoscope - a free astrology app for iOS and Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.1.4
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.2

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/licenses/
    - assets/data/

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    # Subset with only the 12 zodiac glyphs (U+2648-U+2653).
    - family: ZodiacSymbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols-Zodiac.ttf
